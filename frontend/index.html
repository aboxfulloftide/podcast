<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Ad-Remover</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div id="auth-section">
            <div class="row">
                <div class="col-md-6 offset-md-3">
                    <!-- Login Form -->
                    <div id="login-container">
                        <h2>Login</h2>
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="login-username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="login-username" required>
                            </div>
                            <div class="mb-3">
                                <label for="login-password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="login-password" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Login</button>
                            <p class="mt-3">
                                Don't have an account? <a href="#" id="show-register-link">Register here</a>.
                            </p>
                        </form>
                    </div>

                    <!-- Register Form (hidden by default) -->
                    <div id="register-container" class="d-none">
                        <h2>Register</h2>
                        <form id="register-form">
                            <div class="mb-3">
                                <label for="register-username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="register-username" required>
                            </div>
                            <div class="mb-3">
                                <label for="register-password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="register-password" required>
                            </div>
                            <button type="submit" class="btn btn-success">Register</button>
                            <p class="mt-3">
                                Already have an account? <a href="#" id="show-login-link">Login here</a>.
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main App Content (hidden by default) -->
        <div id="app-section" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Podcast Dashboard</h1>
                <button id="logout-btn" class="btn btn-danger">Logout</button>
            </div>

            <h2 class="mb-4">Podcast Search</h2>
            <form id="search-form" class="mb-4">
                <div class="input-group">
                    <input type="text" id="search-query" class="form-control" placeholder="Search for a podcast..." required>
                    <button type="submit" class="btn btn-primary">Search</button>
                </div>
            </form>

            <div id="search-results" class="row">
                <!-- Search results will be injected here by JavaScript -->
            </div>

            <hr class="my-5">

            <h1 class="mb-4">My Subscriptions</h1>
            <div id="my-subscriptions" class="row">
                <!-- User's subscribed podcasts will be injected here by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Episode Modal -->
    <div class="modal fade" id="episodeModal" tabindex="-1" aria-labelledby="episodeModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-xl">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="episodeModalLabel">Episodes for: <span id="modal-podcast-title"></span></h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row">
                <div class="col-md-6">
                    <h3>Episodes</h3>
                    <div id="episode-list">
                        <!-- Episodes will be loaded here -->
                    </div>
                </div>
                <div class="col-md-6">
                    <h3>Ad Removal Controls</h3>
                    <div id="ad-removal-controls">
                        <!-- Audio player and controls for ad removal -->
                        <audio controls id="episode-audio-player" class="w-100 mb-3"></audio>
                        <div id="audio-timeline" class="mb-3" style="position: relative; height: 30px; background-color: #eee; cursor: pointer;">
                            <!-- Markers will be placed here -->
                        </div>
                        <button class="btn btn-secondary mb-2" id="add-marker-btn">Add Marker</button>
                        <ul id="marker-list" class="list-group mb-3">
                            <!-- Markers will be listed here -->
                        </ul>

                        <h4 class="mt-4">Ad Removal Strategy</h4>
                        <form id="ad-removal-form">
                            <div class="mb-3">
                                <label for="ad-removal-strategy" class="form-label">Strategy:</label>
                                <select class="form-select" id="ad-removal-strategy">
                                    <option value="none">None</option>
                                    <option value="remove_before">Remove Before First Marker</option>
                                    <option value="remove_after">Remove After Last Marker</option>
                                    <option value="remove_between">Remove Between Markers</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success">Save Ad Removal Rules</button>
                        </form>
                    </div>
                </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
