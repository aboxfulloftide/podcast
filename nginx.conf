worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Upstream to Gunicorn application
    upstream podcast_ad_remover_app {
        server 0.0.0.0:8000 fail_timeout=0;
    }

    server {
        listen 80; # Listen on port 80 (standard HTTP port)
        server_name your_domain.com localhost; # Replace with your domain name or IP address

        # Root directory for static and index files
        root /home/matheau/code/podcast_v2/frontend; # Adjust this path

        # Serve static frontend files (CSS, JS) directly
        location /static/ {
            alias /home/matheau/code/podcast_v2/frontend/static/; # Adjust this path
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Serve custom RSS feed XML files
        location /custom-feeds/ {
            alias /home/matheau/code/podcast_v2/storage/feeds/; # Adjust this path
            default_type application/xml;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # Serve custom media (audio) files
        location /custom-media/ {
            alias /home/matheau/code/podcast_v2/storage/podcasts/; # Adjust this path
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
            keepalive_requests 100;
            expires 30d;
            add_header Cache-Control "public, no-transform";
            add_header Accept-Ranges bytes; # Required for audio seeking
        }


        # Proxy API requests to Gunicorn
        location /api/ {
            proxy_pass http://podcast_ad_remover_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # Catch-all for frontend routes (SPA handling)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
